<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NB抽学号系统</title>
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/display.css">
  <link rel="stylesheet" href="./styles/panels.css">
  <link rel="stylesheet" href="./styles/buttons.css">
  <link rel="stylesheet" href="./styles/dark-mode.css">
  <link rel="stylesheet" href="./styles/modal.css">
  <link rel="stylesheet" href="./styles/festival-theme.css">
  <link rel="stylesheet" href="./styles/pk-mode.css">
  <link rel="stylesheet" href="./styles/roulette-mode.css">
</head>
<body>
  <div id="app">
    <!-- 节日装饰元素 -->
    <div id="festival-decorations"></div>
    
    <!-- 主容器 -->
    <div class="container">
      <!-- 顶部控制面板 -->
      <div class="control-panel">
        <h1 class="title">NB抽学号系统</h1>
        
        <!-- 模式选择 -->
        <div class="mode-selector">
          <button id="normal-mode-btn" class="mode-btn active" data-mode="normal">标准模式</button>
          <button id="gender-mode-btn" class="mode-btn" data-mode="gender">男女生模式</button>
          <button id="roulette-mode-btn" class="mode-btn" data-mode="roulette">转盘模式</button>
          <button id="pk-mode-btn" class="mode-btn" data-mode="pk">PK模式</button>
        </div>
        
        <!-- 音效控制 -->
        <div class="audio-control">
          <label>
            <input type="checkbox" id="audio-enabled" checked> 音效
          </label>
          <label>
            <input type="checkbox" id="tts-enabled"> 名字播报
          </label>
        </div>
      </div>
      
      <!-- 主显示区域 -->
      <div class="main-display" id="main-display">
        <!-- 标准模式显示 -->
        <div id="normal-display" class="display-section active">
          <div class="current-result">
            <div class="number-display" id="current-number">--</div>
            <div class="name-display" id="current-name">等待抽取</div>
          </div>
          
          <div class="controls">
            <button id="start-btn" class="btn btn-primary">开始抽取</button>
            <button id="stop-btn" class="btn btn-secondary" disabled>停止</button>
            <button id="reset-btn" class="btn btn-warning">重置</button>
          </div>
        </div>
        
        <!-- 男女生模式显示 -->
        <div id="gender-display" class="display-section">
          <div class="gender-controls">
            <select id="gender-select" class="gender-select">
              <option value="all">全部</option>
              <option value="male">男生</option>
              <option value="female">女生</option>
            </select>
            <div class="current-result">
              <div class="number-display" id="gender-current-number">--</div>
              <div class="name-display" id="gender-current-name">等待抽取</div>
            </div>
          </div>
          
          <div class="controls">
            <button id="gender-start-btn" class="btn btn-primary">开始抽取</button>
            <button id="gender-stop-btn" class="btn btn-secondary" disabled>停止</button>
            <button id="gender-reset-btn" class="btn btn-warning">重置</button>
          </div>
        </div>
        
        <!-- 转盘模式显示 -->
        <div id="roulette-display" class="display-section">
          <div class="roulette-controls">
            <select id="roulette-mode-select" class="mode-select">
              <option value="flat">平面转盘</option>
              <option value="3d">立体转盘</option>
            </select>
            <button id="show-roulette-btn" class="btn btn-primary">显示转盘</button>
          </div>
          <div id="roulette-container" class="roulette-container"></div>
        </div>
        
        <!-- PK模式显示 -->
        <div id="pk-display" class="display-section">
          <div class="pk-controls">
            <button id="start-pk-btn" class="btn btn-primary">开始PK</button>
            <button id="end-pk-btn" class="btn btn-warning" disabled>结束PK</button>
          </div>
          <div id="pk-container" class="pk-container">
            <div class="pk-arena">
              <div class="fencer male-fencer">
                <div class="fencer-info">
                  <div class="fencer-name">男生队</div>
                  <div class="fencer-score" id="male-score">0</div>
                </div>
                <div class="fencer-character" id="male-character">♂</div>
              </div>
              <div class="vs-separator">VS</div>
              <div class="fencer female-fencer">
                <div class="fencer-info">
                  <div class="fencer-name">女生队</div>
                  <div class="fencer-score" id="female-score">0</div>
                </div>
                <div class="fencer-character" id="female-character">♀</div>
              </div>
            </div>
            <div id="fencing-animation" class="fencing-animation" style="display: none;">
              <div class="fencer-sprite male-sprite"></div>
              <div class="fencer-sprite female-sprite"></div>
              <div class="sword-effect"></div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- 设置面板 -->
      <div class="settings-panel">
        <button id="settings-btn" class="btn btn-settings">设置</button>
        <button id="import-btn" class="btn btn-import">导入Excel</button>
        <button id="festival-theme-btn" class="btn btn-theme">节日主题</button>
      </div>
      
      <!-- 历史记录 -->
      <div class="history-panel">
        <h3>抽取历史</h3>
        <div id="history-list" class="history-list"></div>
        <button id="clear-history-btn" class="btn btn-small btn-danger">清空历史</button>
      </div>
    </div>
    
    <!-- 模态框 -->
    <div id="modal" class="modal" style="display: none;">
      <div class="modal-content">
        <span class="close">&times;</span>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <!-- 导入脚本 -->
  <script type="module" src="./views/app.js"></script>
</body>
</html>
