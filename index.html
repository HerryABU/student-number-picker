<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <meta name="description" content="智能学号抽取系统 V6.0.0 - 支持学号范围、多Sheet导入、男女筛选、PK模式、公差区间">
  <meta name="theme-color" content="#4361ee">
  <title>智能学号抽取系统 V6.0.0</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app" class="app-container"></div>

  <div id="pasteModal" class="paste-modal">
    <div class="paste-modal-content">
      <h3><i class="fas fa-paste"></i> 粘贴学生数据</h3>
      <p style="font-size:13px;color:var(--text-tertiary);margin-bottom:8px;">每行格式：学号,姓名,性别</p>
      <textarea id="pasteData" rows="6" placeholder="001,张三,男&#10;002,李四,女&#10;003,王五,男"></textarea>
      <div class="paste-buttons">
        <button id="confirmPasteBtn" class="btn btn-primary">导入</button>
        <button id="closePasteBtn" class="btn btn-outline">取消</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
