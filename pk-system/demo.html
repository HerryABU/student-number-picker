<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能学号抽取系统 - 功能演示</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./styles/festival-theme.css">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f0f2f5;
      transition: all 0.5s ease;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .header h1 {
      color: #2c3e50;
      margin-bottom: 10px;
    }
    
    .controls {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .btn {
      padding: 12px 24px;
      margin: 0 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-primary {
      background-color: #4361ee;
      color: white;
    }
    
    .btn-primary:hover {
      background-color: #3a56d4;
    }
    
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    
    .btn-success:hover {
      background-color: #218838;
    }
    
    .btn-warning {
      background-color: #ffc107;
      color: #212529;
    }
    
    .btn-warning:hover {
      background-color: #e0a800;
    }
    
    .btn-danger {
      background-color: #dc3545;
      color: white;
    }
    
    .btn-danger:hover {
      background-color: #c82333;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .demo-section {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      margin-bottom: 30px;
    }
    
    .demo-section h2 {
      color: #2c3e50;
      margin-top: 0;
      border-bottom: 2px solid #eee;
      padding-bottom: 15px;
    }
    
    .theme-selector {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    
    .theme-btn {
      padding: 8px 16px;
      border: 2px solid #ddd;
      border-radius: 20px;
      cursor: pointer;
      background: white;
      transition: all 0.3s;
    }
    
    .theme-btn:hover {
      border-color: #4361ee;
    }
    
    .theme-btn.active {
      background: #4361ee;
      color: white;
      border-color: #4361ee;
    }
    
    #pk-container {
      min-height: 500px;
    }
    
    #pk-mode-container {
      min-height: 500px;
    }
    
    #roulette-mode-container {
      min-height: 500px;
    }
    
    .mode-selector {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    
    .mode-btn {
      padding: 12px 24px;
      border: 2px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      background: white;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .mode-btn:hover {
      border-color: #4361ee;
    }
    
    .mode-btn.active {
      background: #4361ee;
      color: white;
      border-color: #4361ee;
    }
    
    .audio-controls {
      text-align: center;
      margin: 20px 0;
    }
    
    .audio-toggle {
      padding: 10px 20px;
      border: 2px solid #28a745;
      border-radius: 20px;
      cursor: pointer;
      background: #28a745;
      color: white;
      font-weight: 500;
    }
    
    .audio-toggle.off {
      background: #6c757d;
      border-color: #6c757d;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>智能学号抽取系统 V6.0</h1>
      <p>支持PK模式、转盘模式、节日主题和音效</p>
    </div>
    
    <div class="controls">
      <button class="btn btn-primary" onclick="initMainModule()">
        <i class="fas fa-play"></i> 初始化主系统
      </button>
      <button class="btn btn-success" onclick="initPKMode()">
        <i class="fas fa-swords"></i> PK对战模式
      </button>
      <button class="btn btn-warning" onclick="initRouletteMode()">
        <i class="fas fa-dharmachakra"></i> 转盘抽取模式
      </button>
      <button class="btn btn-danger" onclick="destroyAll()">
        <i class="fas fa-power-off"></i> 销毁所有系统
      </button>
    </div>
    
    <div class="audio-controls">
      <button class="audio-toggle" id="audio-toggle" onclick="toggleAudio()">
        <i class="fas fa-volume-up"></i> 音效: 开启
      </button>
    </div>
    
    <div class="theme-selector">
      <button class="theme-btn" onclick="applyFestivalTheme('')">默认主题</button>
      <button class="theme-btn" onclick="applyFestivalTheme('spring')">春节主题</button>
      <button class="theme-btn" onclick="applyFestivalTheme('christmas')">圣诞节主题</button>
      <button class="theme-btn" onclick="applyFestivalTheme('valentine')">情人节主题</button>
      <button class="theme-btn" onclick="applyFestivalTheme('halloween')">万圣节主题</button>
    </div>
    
    <div class="mode-selector">
      <button class="mode-btn active" onclick="switchMode('main')" id="main-mode-btn">
        <i class="fas fa-home"></i> 主系统
      </button>
      <button class="mode-btn" onclick="switchMode('pk')" id="pk-mode-btn">
        <i class="fas fa-swords"></i> PK模式
      </button>
      <button class="mode-btn" onclick="switchMode('roulette')" id="roulette-mode-btn">
        <i class="fas fa-dharmachakra"></i> 转盘模式
      </button>
    </div>
    
    <div id="main-container" class="demo-section">
      <h2><i class="fas fa-home"></i> 主抽取系统</h2>
      <div id="pk-container"></div>
    </div>
    
    <div id="pk-container-section" class="demo-section" style="display: none;">
      <h2><i class="fas fa-swords"></i> PK对战模式</h2>
      <div id="pk-mode-container"></div>
    </div>
    
    <div id="roulette-container-section" class="demo-section" style="display: none;">
      <h2><i class="fas fa-dharmachakra"></i> 转盘抽取模式</h2>
      <div id="roulette-mode-container"></div>
    </div>
  </div>

  <script src="./core/module.js"></script>
  <script>
    let currentInstance = null;
    let currentPKMode = null;
    let currentRouletteMode = null;
    let currentMode = 'main'; // 'main', 'pk', 'roulette'
    let audioEnabled = true;
    
    // 初始化主系统
    async function initMainModule() {
      if (currentInstance) {
        console.log('系统已初始化，先销毁现有实例');
        currentInstance.destroy();
        currentInstance = null;
      }
      
      // 初始化PK模块
      currentInstance = await window.initPKModule({
        target: '#pk-container',
        namespace: 'demo-',
        autoStyleIsolation: true
      });
      
      console.log('主系统初始化完成');
      
      // 显示主系统区域
      switchMode('main');
    }
    
    // 初始化PK模式
    async function initPKMode() {
      if (currentPKMode) {
        console.log('PK模式已初始化，先销毁现有实例');
        currentPKMode.destroy();
        currentPKMode = null;
      }
      
      const PKMode = await window.loadPKMode();
      currentPKMode = new PKMode(document.getElementById('pk-mode-container'), {
        namespace: 'pk-mode-',
        autoStyleIsolation: true
      });
      
      // 设置示例数据
      const malePlayers = [
        { student_id: '001', name: '张三' },
        { student_id: '002', name: '李四' },
        { student_id: '003', name: '王五' },
        { student_id: '004', name: '赵六' },
        { student_id: '005', name: '孙七' }
      ];
      
      const femalePlayers = [
        { student_id: '006', name: '小红' },
        { student_id: '007', name: '小丽' },
        { student_id: '008', name: '小美' },
        { student_id: '009', name: '小芳' },
        { student_id: '010', name: '小云' }
      ];
      
      currentPKMode.setPlayers(malePlayers, femalePlayers);
      
      console.log('PK模式初始化完成');
      
      // 显示PK模式区域
      switchMode('pk');
    }
    
    // 初始化转盘模式
    async function initRouletteMode() {
      if (currentRouletteMode) {
        console.log('转盘模式已初始化，先销毁现有实例');
        currentRouletteMode.destroy();
        currentRouletteMode = null;
      }
      
      const RouletteMode = await window.loadRouletteMode();
      currentRouletteMode = new RouletteMode(document.getElementById('roulette-mode-container'), {
        namespace: 'roulette-mode-',
        autoStyleIsolation: true
      });
      
      // 设置示例数据
      const players = [
        { student_id: '001', name: '张三' },
        { student_id: '002', name: '李四' },
        { student_id: '003', name: '王五' },
        { student_id: '004', name: '赵六' },
        { student_id: '005', name: '孙七' },
        { student_id: '006', name: '小红' },
        { student_id: '007', name: '小丽' },
        { student_id: '008', name: '小美' },
        { student_id: '009', name: '小芳' },
        { student_id: '010', name: '小云' }
      ];
      
      currentRouletteMode.setPlayers(players);
      
      console.log('转盘模式初始化完成');
      
      // 显示转盘模式区域
      switchMode('roulette');
    }
    
    // 切换显示模式
    function switchMode(mode) {
      currentMode = mode;
      
      // 隐藏所有容器
      document.getElementById('main-container').style.display = 'none';
      document.getElementById('pk-container-section').style.display = 'none';
      document.getElementById('roulette-container-section').style.display = 'none';
      
      // 激活对应的按钮
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      
      switch (mode) {
        case 'main':
          document.getElementById('main-container').style.display = 'block';
          document.getElementById('main-mode-btn').classList.add('active');
          break;
        case 'pk':
          document.getElementById('pk-container-section').style.display = 'block';
          document.getElementById('pk-mode-btn').classList.add('active');
          break;
        case 'roulette':
          document.getElementById('roulette-container-section').style.display = 'block';
          document.getElementById('roulette-mode-btn').classList.add('active');
          break;
      }
    }
    
    // 销毁所有系统
    function destroyAll() {
      if (currentInstance) {
        currentInstance.destroy();
        currentInstance = null;
        console.log('主系统已销毁');
      }
      
      if (currentPKMode) {
        currentPKMode.destroy();
        currentPKMode = null;
        console.log('PK模式已销毁');
      }
      
      if (currentRouletteMode) {
        currentRouletteMode.destroy();
        currentRouletteMode = null;
        console.log('转盘模式已销毁');
      }
    }
    
    // 切换音效
    async function toggleAudio() {
      const audioManager = await window.loadAudioManager();
      audioEnabled = !audioEnabled;
      
      audioManager.setEnabled(audioEnabled);
      
      const toggleBtn = document.getElementById('audio-toggle');
      if (audioEnabled) {
        toggleBtn.innerHTML = '<i class="fas fa-volume-up"></i> 音效: 开启';
        toggleBtn.classList.remove('off');
      } else {
        toggleBtn.innerHTML = '<i class="fas fa-volume-mute"></i> 音效: 关闭';
        toggleBtn.classList.add('off');
      }
    }
    
    // 应用节日主题
    function applyFestivalTheme(theme) {
      window.applyFestivalTheme(theme);
      
      // 更新按钮状态
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.remove('active');
        if ((theme === '' && btn.textContent === '默认主题') || 
            (theme !== '' && btn.textContent.toLowerCase().includes(theme))) {
          btn.classList.add('active');
        }
      });
    }
    
    // 页面加载完成后初始化主系统
    window.addEventListener('load', async () => {
      await initMainModule();
    });
  </script>
</body>
</html>
